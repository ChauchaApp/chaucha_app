# CI/CD de las Edge Functions de Supabase (Deno): tipos de todas las
# funciones y pruebas de los módulos compartidos (Redis con fail-open,
# límites, EWKB). En cada push a master que pase la revisión, las despliega.
#
# Para desplegar hacen falta:
#   secreto  SUPABASE_ACCESS_TOKEN  token personal de Supabase
#   variable SUPABASE_PROJECT_REF   ref del proyecto (jfydcvrlfmnlbleecgqr)
# Los secretos de las funciones (Gemini, AWS, Firebase...) siguen en Supabase.
name: Edge Functions

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions.yml'
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funciones-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: supabase/functions

jobs:
  verificar:
    name: Revisar tipos y probar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.12

      - name: Revisión de tipos
        run: deno check */index.ts

      - name: Pruebas de _shared
        run: deno test --allow-env --allow-net=none _shared/

  desplegar:
    name: Desplegar en Supabase
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: despliegue-funciones
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROYECTO: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar secretos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROYECTO" ]; then
            echo "::error::Faltan SUPABASE_ACCESS_TOKEN (secreto) o SUPABASE_PROJECT_REF (variable)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Las que llama la app: exigen el JWT del usuario.
      - name: Funciones con sesión
        run: >-
          supabase functions deploy
          validar-foto-rostro comparar-rostro-cedula
          verificar-rostro-sesion verificar-rostro-postulacion
          sector presencia
          --project-ref "$PROYECTO" --use-api

      # Las que llama la base con pg_net: se protegen con x-push-secreto.
      - name: Funciones del servidor (sin JWT)
        run: >-
          supabase functions deploy enviar-push anuncios
          --project-ref "$PROYECTO" --use-api --no-verify-jwt
